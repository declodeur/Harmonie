name: Compilation Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et compilation
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :engine:test :desktop:createDistributable 2>&1 | tee build.log

      # En cas d'échec, regroupe les erreurs dans une annotation lisible depuis l'API GitHub
      - name: Résumé des erreurs
        if: failure()
        shell: bash
        run: |
          msg=$(grep -E "^e: |FAILED|What went wrong|AssertionFailedError|Exception|^> " build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Echec de compilation::${msg}"

      - name: Archive zip portable
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/Harmonie -DestinationPath Harmonie-windows-build-${{ github.run_number }}.zip

      - name: Publication dans Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "Harmonie-windows-build-${{ github.run_number }}.zip" \
            --title "Harmonie (build ${{ github.run_number }})" \
            --notes "Compilation automatique du commit ${{ github.sha }}. Dézippez, puis lancez Harmonie\\Harmonie.exe." \
            --target "${{ github.sha }}"
